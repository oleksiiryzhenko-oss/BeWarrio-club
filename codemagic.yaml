workflows:
  android-release:
    name: BeеWarrior club — signed APK and AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - BeеWarrior
    scripts:
      - name: Configure Android SDK
        script: |
          set -eu
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Check signing
        script: |
          set -eu
          : "${CM_KEYSTORE_PATH:?Connect the BeеWarrior keystore in Codemagic}"
          : "${CM_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${CM_KEY_ALIAS:?Missing key alias}"
          : "${CM_KEY_PASSWORD:?Missing key password}"
      - name: Build release APK and AAB
        script: |
          set -eu
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --console=plain
      - name: Verify APK and AAB artifacts
        script: |
          set -eu
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
